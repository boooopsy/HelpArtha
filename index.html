<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whetstone — Spaced Repetition & Deep Mastery</title>
  
  <!-- Offline KaTeX Mathematical Formula Rendering -->
  <link rel="stylesheet" href="assets/katex/katex.min.css">
  
  <!-- Standalone Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">
    <!-- Navigation Rail -->
    <aside class="nav-rail">
      <div class="brand-block">
        <div class="brand-title">
          <span>WHETSTONE</span>
        </div>
        <div class="brand-sub">
          29 Modules · 87 Projects<br>
          1,638 Concepts · FSRS-6
        </div>
      </div>

      <nav class="nav-links">
        <div class="nav-item active" data-route="today">
          <span>☀️</span>
          <span>Today</span>
        </div>
        <div class="nav-item" data-route="drill">
          <span>⚡</span>
          <span>Drill Loop</span>
          <span class="badge" id="drill-count-badge" style="display: none;"></span>
        </div>
        <div class="nav-item" data-route="browse">
          <span>📚</span>
          <span>Curriculum</span>
        </div>
        <div class="nav-item" data-route="projects">
          <span>🛠️</span>
          <span>Projects</span>
        </div>
        <div class="nav-item" data-route="mastery">
          <span>🗺️</span>
          <span>Mastery Map</span>
        </div>
        <div class="nav-item" data-route="settings">
          <span>⚙️</span>
          <span>Settings</span>
        </div>
      </nav>

      <div class="rail-footer">
        <div class="mode-switcher" id="rail-mode-switcher">
          <button class="mode-btn active" data-mode="apprentice" id="btn-mode-apprentice">Apprentice</button>
          <button class="mode-btn" data-mode="master" id="btn-mode-master">Master</button>
        </div>

        <div class="hardware-hud" title="Target Hardware Invariant Bus">
          <span class="hw-indicator"></span>
          <span>COM4: RP2040 Sim</span>
        </div>

        <div class="user-badge" id="user-badge" title="Manage User & Passwords">
          <div>
            <div style="font-size: 0.7rem; color: var(--faint); text-transform: uppercase; font-family: var(--mono);">Learner</div>
            <div class="user-name" id="user-display-name">Kumar</div>
          </div>
          <span style="font-size: 0.8rem; color: var(--accent);">Switch ⚙</span>
        </div>

        <button class="quick-theme-toggle" id="btn-toggle-theme">
          <span>◑</span> Toggle Theme
        </button>
      </div>
    </aside>

    <!-- Main View -->
    <main class="main-view">
      <!-- Top Bar / Global Search & System HUD -->
      <header class="top-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="global-search" placeholder="Search concepts, modules, tokens (P00, RISC-V, Cache)..." autocomplete="off">
        </div>

        <div class="top-bar-hud" style="display: flex; align-items: center; gap: 1rem; font-family: var(--mono); font-size: 0.8rem; flex-wrap: wrap;">
          <div class="hud-item" style="color: var(--faint);">
            <span style="color: var(--good); animation: pulse 2s infinite; display: inline-block;">●</span> HW: <span id="hud-hw-status">RP2040 (Virtual Sim)</span>
          </div>
          <div class="hud-item" style="color: var(--faint);">
            FSRS-6: <span style="color: var(--accent); font-weight: 600;">85% Target</span>
          </div>
          <button class="btn btn-outline" id="btn-density-mode" style="padding: 3px 8px; font-size: 0.75rem;">
            ⚡ Apprentice Mode
          </button>
        </div>
      </header>

      <!-- Dynamic Screen Container -->
      <section id="main-content">
        <!-- Rendered by app.js -->
      </section>
    </main>
  </div>

  <!-- KaTeX library -->
  <script src="assets/katex/katex.min.js"></script>

  <!-- Complete Bundled Curriculum (24 Domains, 1,638 Concepts, Projects, Tracks) -->
  <script src="whetstone-data.js"></script>

  <!-- Pure FSRS-6 Scheduling Engine -->
  <script src="fsrs.js"></script>

  <!-- Local User Accounts & State Store (JSON export/import) -->
  <script src="store.js"></script>

  <!-- Application Controller & Router -->
  <script src="app.js"></script>

</body>
</html>
